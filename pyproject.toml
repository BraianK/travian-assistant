[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travian-assistant"
version = "1.1.0"
authors = [{ name = "Dzogurt" }]
description = "Local desktop assistant for tracking villages and resources in Travian Kingdoms"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pychrome==0.2.4",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
travian-assistant = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
